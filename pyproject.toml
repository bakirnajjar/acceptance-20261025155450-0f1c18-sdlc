[project]
name = "password-reset-demo"
version = "0.1.0"
description = "Local Flask/Jinja password-reset demonstration scaffold"
requires-python = ">=3.12"
dependencies = [
    "flask==3.1.3",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
