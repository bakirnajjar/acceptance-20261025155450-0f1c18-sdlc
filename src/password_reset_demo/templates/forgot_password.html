{% extends "base.html" %}
{% block title %}Forgot password · Password reset demo{% endblock %}
{% block content %}
<section class="card" aria-labelledby="reset-heading">
  <h1 id="reset-heading">Forgot password?</h1>
  <p>Enter your email address to request a password reset.</p>
  <form action="{{ url_for('forgot_password') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="reset-email">Email address</label>
      <input id="reset-email" name="email" type="email" autocomplete="email"
             placeholder="name@example.com" required
             {% if email_error %}aria-invalid="true" aria-describedby="reset-email-error" autofocus{% endif %}>
      {% if email_error %}
      <p id="reset-email-error" class="field-error" role="alert">{{ email_error }}</p>
      {% endif %}
    </div>
    <button class="primary-button" type="submit">Request password reset</button>
  </form>
  <a class="return-link" href="{{ url_for('sign_in') }}">Back to sign in</a>
</section>
{% endblock %}
